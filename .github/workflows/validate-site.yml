name: Validate ROAM static site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify HTML entry point and asset references
        run: node scripts/check-site.cjs
      - name: Check calendar JavaScript syntax
        run: node --check js/pickers.js
