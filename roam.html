<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Roam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ccircle cx='5' cy='5' r='5' fill='%23FCCC0A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. TOKENS: signage black/white + MTA line colours, Helvetica
   ========================================================= */
:root{color-scheme:light;
--white:#FFFFFF;--black:#000000;--bg:#FFFFFF;--s1:#F6F6F4;--s2:#EEEEEB;--s3:#DCDCD8;--tx2:#5C5C5C;--tx3:#8A8A8A;
--red:#EE352E;--green:#00933C;--blue:#0039A6;--orange:#FF6319;--yellow:#FCCC0A;--lime:#6CBE45;--brown:#996633;--purple:#B933AD;--grey:#A7A9AC;--teal:#00ADD0;
--ac:var(--yellow);--r1:8px;--r2:12px;--r3:20px;--shadow:0 6px 20px rgba(0,0,0,.18);--ease:cubic-bezier(.32,.72,0,1);
--font:"Helvetica Neue",Helvetica,Arial,"Nimbus Sans",system-ui,sans-serif}
/* a "line" = a colour + the text colour that sits on it (set --lc / --lt on any parent) */
.l-red,.l-green,.l-blue,.l-orange,.l-brown,.l-purple{--lt:var(--white)}.l-yellow,.l-lime,.l-grey,.l-teal{--lt:var(--black)}
.l-red{--lc:var(--red)}.l-green{--lc:var(--green)}.l-blue{--lc:var(--blue)}.l-orange{--lc:var(--orange)}.l-yellow{--lc:var(--yellow)}.l-lime{--lc:var(--lime)}.l-brown{--lc:var(--brown)}.l-purple{--lc:var(--purple)}.l-grey{--lc:var(--grey)}.l-teal{--lc:var(--teal)}
/* =========================================================
   2. BASE + TYPE
   ========================================================= */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:400 15px/22px var(--font);color:var(--black);background:#E6E6E2;min-height:100vh;display:grid;place-items:center}
button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;text-align:inherit;padding:0}button:disabled{opacity:.35;cursor:not-allowed}
[hidden]{display:none!important}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1{font:700 30px/34px var(--font);letter-spacing:-.03em}h2{font:700 22px/28px var(--font);letter-spacing:-.02em}h3{font:700 16px/22px var(--font)}b{font-weight:700}
.cap{font-size:13px;line-height:18px;color:var(--tx2)}.sm{font-size:12px;line-height:16px}.err{color:var(--red);font-weight:700}.eyebrow{font-size:12px;line-height:16px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--black)}
.pad{padding:0 24px}.gr{flex:1;min-width:0}.mt{margin-top:10px}
#dev{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);border:1px solid #BDBDB8;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.18)}
@media(max-width:480px){body{display:block;background:var(--bg)}#dev{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}}
#sb{position:absolute;top:0;left:0;right:0;height:50px;z-index:70;display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0;font-weight:700;font-size:14px;pointer-events:none}
#hi{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--black);z-index:70;pointer-events:none}
/* =========================================================
   3. COMPONENTS (each has one JS builder of the same name)
   ========================================================= */
/* Bullet + Cover: the route bullet is the brand mark */
.bl{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--lc);color:var(--lt);font-weight:700;font-size:15px;line-height:1}.bl.s{width:20px;height:20px;font-size:11px}.bl.l{width:40px;height:40px;font-size:22px}
.cover{--cz:52px;width:var(--cz);height:var(--cz);flex:none;background:var(--black);display:grid;place-items:center;border-radius:6px}.cover .bl{width:62%;height:62%;font-size:calc(var(--cz)*.34)}
.z-xs{--cz:40px}.z-s{--cz:56px;border-radius:6px 0 0 6px}.z-m{--cz:52px}.z-l{--cz:128px;border-radius:10px}.z-xl{--cz:188px;border-radius:12px;box-shadow:var(--shadow)}
/* Avatar + Stack */
.av{width:32px;height:32px;flex:none;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12px;background:var(--lc);color:var(--lt)}.av.big{width:40px;height:40px;font-size:15px}.av.xl{width:104px;height:104px;font-size:44px}.av.tab{width:24px;height:24px;font-size:10px}
.st{display:inline-flex}.st .av{width:24px;height:24px;font-size:10px;box-shadow:0 0 0 2px var(--bg)}.st .av+.av{margin-left:-8px}
/* Button / IconButton / Pill / Tag */
.btn{height:48px;padding:0 24px;border-radius:999px;background:var(--black);color:var(--white);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .1s,background .15s}.btn:active{transform:scale(.98)}
.btn.y{background:var(--ac);color:var(--black)}.btn.sec{background:var(--s2);color:var(--black)}.btn.out{background:transparent;box-shadow:inset 0 0 0 1.5px var(--black);color:var(--black)}.btn.dg{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}.btn.sm2{height:36px;padding:0 16px;font-size:13px;width:auto}
.ib{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;transition:background .15s}.ib:active{background:var(--s2)}.ib.f{background:var(--s2)}
.play{width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--black);display:grid;place-items:center;flex:none;transition:transform .1s}.play:active{transform:scale(.94)}
.pill{height:32px;padding:0 14px;border-radius:999px;background:var(--s2);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap}.pill.on{background:var(--black);color:var(--white)}.pill:active{transform:scale(.97)}
.pills{display:flex;gap:8px;padding:0 24px;overflow-x:auto}.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag{height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;background:var(--s2);flex:none}.tag.ok{background:var(--green);color:var(--white)}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.dotc.ok{background:var(--green)}.dotc.wait{background:var(--orange)}.dotc.off{background:var(--tx3)}
/* Field / Input / Switch */
.in,.fld{width:100%;height:48px;border-radius:var(--r1);background:var(--s2);border:1.5px solid transparent;padding:0 14px}.in:focus{outline:none;border-color:var(--black);background:var(--white)}.in.bad{border-color:var(--red)}textarea.in{height:auto;padding:12px 14px;resize:none}
.fld{display:flex;align-items:center;gap:10px;height:52px;color:var(--tx2);font-weight:500;background:var(--white);box-shadow:0 4px 16px rgba(0,0,0,.14)}.fld.hl{box-shadow:inset 0 0 0 2px var(--black),0 4px 16px rgba(0,0,0,.14);color:var(--black);font-weight:700}.fld .bl{background:var(--ac);color:var(--black)}
.lb{font-weight:700;font-size:13px;margin-bottom:6px;display:block}.sw{width:48px;height:28px;border-radius:999px;background:var(--s3);position:relative;flex:none;transition:background .2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--white);transition:transform .2s var(--ease)}.sw.on{background:var(--black)}.sw.on::after{transform:translateX(20px)}
/* Row / Section / TopBar / Empty / Banner / Sign */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:8px 24px;text-align:left;min-height:64px}.row:active{background:var(--s1)}div.row:active{background:none}
.row .gr b,.row .gr .cap{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row.wrap .gr b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
div.sec{display:flex;justify-content:space-between;align-items:baseline;padding:28px 24px 12px}div.sec button{font-size:13px;font-weight:700;color:var(--tx2)}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:4px 12px 0;min-height:50px}.top .tt{text-align:center}.hd{padding:8px 24px 4px}
.empty{margin:0 24px;padding:24px 16px;border-radius:var(--r2);background:var(--s1);text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.ban{margin:16px 24px 0;padding:16px;border-radius:var(--r2);background:var(--s1);display:flex;flex-direction:column;gap:12px}.ban .r{display:flex;gap:12px;align-items:center}
.sign{display:flex;align-items:center;gap:12px;background:var(--black);color:var(--white);border-radius:var(--r2);padding:12px 14px}.sign .cap{color:#CFCFCF}.sign .ib{color:var(--white)}.sign .ib:active{background:#2A2A2A}
.si{width:40px;height:40px;border-radius:var(--r1);background:var(--s2);display:grid;place-items:center;flex:none}
/* Tile (home grid) + Feature card */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 24px;margin-top:12px}.tile{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:6px;overflow:hidden;height:56px;padding-right:8px;text-align:left}.tile:active{background:var(--s2)}.tile b{font-size:13px;line-height:17px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat{margin:0 24px;padding:16px;border-radius:var(--r2);background:color-mix(in srgb,var(--lc) 16%,var(--white));display:flex;gap:16px;align-items:flex-start;width:calc(100% - 48px);text-align:left}
/* Stepper: a mini subway line */
.step{display:flex;padding:20px 24px 4px}.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12px;line-height:14px;font-weight:700;color:var(--tx3)}
.stp::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:4px;background:var(--s3)}.stp:first-child::before{display:none}
.stp.done::before,.stp.on::before{background:var(--lc,var(--black))}.stp.lock::before{background:var(--s3)}
.sd{width:24px;height:24px;border-radius:50%;background:var(--white);border:3px solid var(--s3);display:grid;place-items:center;font-size:11px;position:relative;z-index:1;color:var(--tx3)}
.stp.done .sd{background:var(--lc,var(--black));border-color:var(--lc,var(--black));color:var(--lt,var(--white))}.stp.on .sd{border-color:var(--black);background:var(--ac);color:var(--black)}.stp.on{color:var(--black)}
/* Vote row */
.vt{display:flex;align-items:center;gap:4px}.vt .cap{width:16px;text-align:center}.vb{width:36px;height:36px;border-radius:50%;background:var(--s2);display:grid;place-items:center}.vb[aria-pressed=true].up{background:var(--green);color:var(--white)}.vb[aria-pressed=true].dn{background:var(--red);color:var(--white)}
.dock{margin-top:auto;position:sticky;bottom:92px;padding:16px 24px 12px;background:linear-gradient(rgba(255,255,255,0),var(--white) 28%);z-index:5}.dock.low{bottom:0;padding-bottom:28px}
.lockc{margin:16px 24px 0;padding:24px 16px;border-radius:var(--r2);background:var(--s1);display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}.segs{display:flex;gap:4px;width:100%;margin-top:4px}.segs i{flex:1;height:6px;border-radius:3px;background:var(--s3)}.segs i.on{background:var(--lc,var(--black))}
/* Timeline: stops are stations on the trip's line */
.tl{list-style:none;display:flex;flex-direction:column;padding:0 24px}.tn{display:flex;align-items:center;gap:14px;min-height:44px;padding:4px 0;text-align:left}.tn[data-a]{cursor:pointer}
.nd{width:28px;height:28px;flex:none;border-radius:50%;background:var(--white);border:3px solid var(--lc);display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;z-index:1}
.tn.org .nd{width:16px;height:16px;margin:6px;border-color:var(--black);background:var(--black)}.tn.cur .nd{background:var(--lc);color:var(--lt);transform:scale(1.18)}.tn.done .nd{background:var(--black);border-color:var(--black);color:var(--white)}
.tc{display:flex;align-items:center;gap:14px;height:34px}.tc .ln{position:relative;width:28px;height:100%;flex:none}.tc .ln::after{content:"";position:absolute;left:11px;width:6px;top:-3px;bottom:-3px;background:var(--lc)}.tc.done .ln::after{background:var(--black)}.tc .cap{display:flex;gap:4px;align-items:center}
/* =========================================================
   4. APP SHELL: screens, tab bar, FAB, mini bar, layers, toast
   ========================================================= */
.scr{position:absolute;inset:0;padding-top:50px;overflow-y:auto;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .32s var(--ease),visibility 0s .32s}
.scr.on{transform:none;visibility:visible;transition:transform .32s var(--ease),visibility 0s}.scr.under{transform:translateX(-20%);visibility:none}.nt .scr{transition:none!important}
.instant .scr,.instant #tb{transition:none!important}
.scr.nos,.scr.rls{overflow:hidden;padding:0}.scr.flex{display:flex;flex-direction:column;padding-bottom:24px}
.pg{min-height:100%;display:flex;flex-direction:column;padding-bottom:128px}.pg>*{flex:none}
.wash{background:linear-gradient(color-mix(in srgb,var(--lc) 34%,var(--white)),var(--bg));margin-top:-50px;padding-top:50px}.hero{display:flex;justify-content:center;padding:8px 24px 20px}
.acts{display:flex;align-items:center;gap:4px;padding:12px 12px 0 18px}
#tb{position:absolute;bottom:0;left:0;right:0;height:84px;padding:0 8px 28px;background:var(--bg);border-top:1px solid var(--s3);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;transition:transform .3s var(--ease)}#tb.off{transform:translateY(120px)}
#tb button{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:9px;font-size:10px;line-height:12px;font-weight:700;color:var(--tx3);position:relative}
#tb .ti{position:relative;display:grid}#tb .on .av{box-shadow:0 0 0 2px var(--teal)}
#tb .ctr{padding-top:44px}#tb .circ{position:absolute;left:50%;top:-26px;margin-left:-32px;width:64px;height:64px;border-radius:50%;background:var(--ac);color:var(--black);border:4px solid var(--bg);display:grid;place-items:center;transition:transform .1s,background .2s}
#tb .ctr:active .circ{transform:scale(.94)}#tb .ctr.on .circ{background:var(--black);color:var(--ac)}
.bdg{position:absolute;right:-9px;top:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);color:var(--white);font-size:10px;line-height:16px;font-weight:700;text-align:center;font-style:normal;box-shadow:0 0 0 2px var(--bg)}.bdg.dot{min-width:9px;width:9px;height:9px;padding:0;right:-4px;top:-3px}
#fab,#psave{position:absolute;left:50%;bottom:122px;transform:translateX(-50%);z-index:22;height:44px;padding:0 18px;border-radius:999px;background:var(--black);color:var(--white);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow);white-space:nowrap;transition:transform .1s}#fab:active,#psave:active{transform:translateX(-50%) scale(.96)}#fab .bl{background:var(--ac);color:var(--black)}
.mini{position:absolute;left:12px;right:12px;bottom:118px;z-index:21;height:56px;border-radius:var(--r2);background:var(--black);color:var(--white);display:flex;align-items:center;gap:12px;padding:0 12px;box-shadow:var(--shadow);text-align:left}.mini .cap{color:#CFCFCF}.mini .gr b,.mini .gr .cap{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ly{position:absolute;inset:0;z-index:40;visibility:hidden;transition:visibility 0s .3s}#ly.open{visibility:visible;transition:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}.open .scrim{opacity:1}
#lyc{position:absolute;background:var(--white);outline:none}#lyc.sheet{left:0;right:0;bottom:0;max-height:92%;border-radius:var(--r3) var(--r3) 0 0;transform:translateY(105%);transition:transform .36s var(--ease);display:flex;flex-direction:column}.open #lyc.sheet{transform:none}
#lyc.dlg{left:28px;right:28px;top:50%;border-radius:16px;opacity:0;transform:translateY(-46%) scale(.96);transition:opacity .2s,transform .28s var(--ease)}.open #lyc.dlg{opacity:1;transform:translateY(-50%)}
.lyb{overflow:auto;padding:0 0 28px;display:flex;flex-direction:column}.dlg .lyb{padding:24px;gap:8px}
.grab{height:20px;flex:none;display:grid;place-items:center;cursor:grab;touch-action:none}.grab::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--s3)}
.mh{display:flex;gap:14px;align-items:center;padding:8px 24px 16px;border-bottom:1px solid var(--s2);margin-bottom:6px}.mi{display:flex;align-items:center;gap:16px;width:100%;padding:12px 24px;min-height:56px;font-weight:700;font-size:16px;text-align:left}.mi:active{background:var(--s1)}.mi.dg,.mi.dg svg{color:var(--red)}
#toast{position:absolute;top:54px;left:16px;right:16px;z-index:60;background:var(--black);color:var(--white);font-weight:700;font-size:14px;padding:12px 16px;border-radius:var(--r2);display:flex;justify-content:space-between;align-items:center;gap:12px;opacity:0;transform:translateY(-16px);pointer-events:none;transition:.25s var(--ease);box-shadow:var(--shadow)}#toast.on{opacity:1;transform:none;pointer-events:auto}#toast button{color:var(--ac);font-weight:700;padding:8px;margin:-8px}
/* map */
.mapbg,.mb{position:absolute;inset:0;width:100%;height:100%}.mapbg svg{width:100%;height:100%}.mb{pointer-events:none}.mb polyline{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.rc{stroke:var(--white);stroke-width:11}.rl{stroke:var(--lc);stroke-width:6}.rl.dash{stroke-dasharray:1 11;stroke-width:6}.rt{stroke:var(--black);stroke-width:6}.rh{stroke:transparent;stroke-width:22;pointer-events:stroke;cursor:pointer}
.pin{position:absolute;transform:translate(-50%,-50%);z-index:2;display:grid;place-items:center;transition:transform .25s var(--ease)}
.pin.b{width:32px;height:32px;border-radius:50%;background:var(--lc);color:var(--lt);border:3px solid var(--white);font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.35)}.pin.b.cand{background:var(--white);color:var(--black);border-color:var(--lc)}
.pin.d{width:14px;height:14px;border-radius:50%;background:var(--white);border:3px solid var(--lc);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pin.stn{width:30px;height:30px;border-radius:50%;background:var(--white);border:3px solid var(--lc);color:var(--black);font-weight:700;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3)}.pin.stn.cur{background:var(--lc);color:var(--lt);transform:translate(-50%,-50%) scale(1.25);z-index:3}.pin.stn.done{background:var(--black);border-color:var(--black);color:var(--white)}
.pl{position:absolute;transform:translate(-50%,-48px);z-index:4;background:var(--black);color:var(--white);border-radius:6px;padding:4px 8px;font-weight:700;font-size:12px;white-space:nowrap}
.you{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--blue);border:3px solid var(--white);box-shadow:0 0 0 8px rgba(0,57,166,.2);z-index:2}
.mtop{position:absolute;top:56px;left:16px;right:16px;z-index:4;display:flex;gap:8px}.mtop .fld{padding:0 16px}.mtop input{flex:1;background:none;border:0;outline:none;height:100%}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 12px;border-radius:999px;background:var(--white);box-shadow:0 4px 16px rgba(0,0,0,.2);font-weight:700}
.msh{--pk:240px;position:absolute;left:0;right:0;bottom:84px;height:600px;background:var(--white);border-radius:var(--r3) var(--r3) 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.14);transform:translateY(calc(100% - var(--pk)));transition:transform .4s var(--ease);display:flex;flex-direction:column;z-index:15}.msh.nav{--pk:300px}.msh.x{transform:none}
#mc{flex:1;overflow:auto;padding:0 0 24px;display:flex;flex-direction:column;gap:12px}#mc .pad{display:flex;flex-direction:column;gap:12px}
/* reels / chat / profile */

/* ---------- fork flow: layers ---------- */
const exiHTML=()=>{const t=trip(S.mapTrip);return `<div class="mh"><div class="gr"><h2>What’s changed?</h2><div class="cap sm">${t.n}</div></div>${IBtn('x','closeLy','Close')}</div><div class="pad">${art('fork-intro')}</div><p class="cap pad" style="margin:12px 0 4px">Pick what’s going on. We’ll flag the stops you can’t do and suggest calmer places nearby.</p><div role="group" aria-label="What changed">${EXI.map(e=>`<button class="cx" role="checkbox" aria-checked="${S.fx.includes(e.id)}" data-a="fx:${e.id}"><span class="xic">${ic(e.ic,22)}</span><span class="gr"><b>${e.n}${e.prof&&S.p.health.includes(e.prof)?' <span class="tag">On your profile</span>':''}</b><span class="cap sm">${e.s}</span></span><span class="cbx">${ic('check',16)}</span></button>`).join('')}</div><div class="note">${ic('git-branch',16)}<span>Your group stays on the main path. A trip can have one extra path, and anyone can join it from the map.</span></div><div class="pad" style="margin-top:16px">${Btn('Flag affected stops','fapply',{off:!S.fx.length})}</div>`};
const clearHTML=()=>`<div class="mh"><div class="gr"><h2>Nothing’s affected</h2><div class="cap sm">Your plan still works</div></div>${IBtn('x','closeLy','Close')}</div><div class="pad">${art('fork-clear')}</div><p class="cap pad" style="margin:12px 0 16px">None of the stops on your path clash with what you picked, so there’s nothing to swap.</p><div class="fl">${Btn('Change my answer','fagain',{v:'sec'})}${Btn('Done','closeLy')}</div>`;
const altInfoHTML=()=>{const al=S.alts[S.ap],x={ph:null,n:al.n,loc:al.s,sc:al.sc,rv:al.rv,pr:al.pr,c:'green',i:al.i};return `<div class="mh"><h2 class="gr">${al.n}</h2>${IBtn('x','closeLy','Close')}</div><div class="pad">${Img(x)}<dl class="kv"><dt>Review</dt><dd>${Stars(al.sc,al.rv)}</dd><dt>Price</dt><dd>${al.pr}</dd><dt>Distance</dt><dd>${al.leg}</dd><dt>Why this</dt><dd>${al.why}</dd></dl></div><div class="pad" style="margin-top:20px">${Btn('Confirm selection','fconfirm')}</div>`};
const doneHTML=t=>{const fk=t.fork,ch=Object.keys(fk.ch).map(Number),oth=mainMembers(t).map(pn).join(' and ');return `<div class="mh"><div class="gr"><h2>You’re on ${esc(pn('P'))}’s path</h2><div class="cap sm">${t.n}</div></div>${IBtn('x','closeLy','Close')}</div><div class="pad">${art('fork-done')}</div><div class="fl" style="margin-top:16px">${ch.map(i=>`<div class="chg"><span class="xic">${ic('git-branch',20)}</span><div class="gr"><b>${fk.stops[i].n}</b><div class="cap sm">replaces ${fk.stops[i].from}</div></div></div>`).join('')}<p class="cap">${oth||'Everyone else'} stay on the main path. Share yours and they can join it by tapping its route on the map.</p>${Btn('Invite the group','finvite',{i:'send'})}${Btn('Back to the map','closeLy',{v:'sec'})}</div>`};
const joinHTML=(t,w)=>{const fk=t.fork,mem=w=='fork'?fk.members:mainMembers(t),nm=w=='fork'?pn(fk.owner)+'’s path':'the main path',ch=Object.keys(fk.ch).map(Number);return `<div class="mh"><div class="gr"><h2>${w=='fork'?'Join '+esc(nm):'Back to the main path'}</h2><div class="cap sm">${t.n}</div></div>${IBtn('x','closeLy','Close')}</div><div class="fl"><div class="chg">${Stack(mem.join(''))}<div class="gr"><b>${mem.length} going</b><div class="cap sm">${mem.map(pn).join(', ')||'No one yet'}</div></div></div>${w=='fork'?ch.map(i=>`<div class="chg"><span class="xic">${ic('git-branch',20)}</span><div class="gr"><b>${esc(fk.stops[i].n)}</b><div class="cap sm">replaces ${esc(fk.stops[i].from)}</div></div></div>`).join(''):`<p class="cap">Follow the group’s original plan. Your changes stay saved if you want to switch back.</p>`}<p class="cap">You can switch paths any time until the trip ends. A trip can have one main path and one extra path.</p>${Btn(w=='fork'?'Join '+esc(nm):'Switch to main path','pathjoin:'+w+':'+t.id)}${Btn('Cancel','closeLy',{v:'sec'})}</div>`};
const blockedHTML=t=>`<div class="mh"><div class="gr"><h2>This trip already has an extra path</h2><div class="cap sm">${t.n}</div></div>${IBtn('x','closeLy','Close')}</div><div class="fl"><p class="cap">To keep plans simple, a trip can have one main path and one extra path. You can join ${esc(pn(t.fork.owner))}’s path instead of making a new one.</p>${Btn('See '+esc(pn(t.fork.owner))+'’s path','pathpick:fork:'+t.id)}${Btn('Stay on main','closeLy',{v:'sec'})}</div>`;

/* ---------- trip page hooks ---------- */
const altRow=t=>{if(!fin(t)||!baseStops(t).length||dd(t.date)<0)return '';const w=forkWin(t),bl=t.fork&&!t.fork.members.includes('P');return `<div class="altrow">${Btn(bl?'See paths':'View alternatives','forkopen',{v:'sec',i:'git-branch',off:!w})}<div class="cap sm">${w?(bl?'This trip already has an extra path.':'Something come up? Fork the plan just for you.'):'Opens 24 hours before the trip starts'}</div></div>`};
const pathSeg=t=>{if(!t.fork)return '';const v=vpath(t);return `<div class="pathseg"><div class="seg" role="radiogroup" aria-label="View path">${[['main','Main path'],['fork',pn(t.fork.owner)+'’s path']].map(([k,l])=>`<button role="radio" aria-checked="${v==k}" data-a="pview:${k}">${esc(l)}</button>`).join('')}</div></div>`};
const forkBan=t=>{if(!t.fork)return '';const v=vpath(t),me=myPath(t);return v==me?`<div class="youpath">${ic('git-branch',18)}You’re on ${v=='fork'?esc(pn(t.fork.owner))+'’s path':'the main path'}.</div>`:`<div class="ban"><div><b>${v=='fork'?esc(pn(t.fork.owner))+'’s path':'Main path'}</b><div class="cap">${v=='fork'?'Their changes replace '+Object.keys(t.fork.ch).length+' stop'+(Object.keys(t.fork.ch).length==1?'':'s')+'.':'The group’s original plan.'}</div></div>${Btn('Join this path','pathpick:'+v+':'+t.id)}</div>`};

/* ---------- chat ---------- */
const chatList=()=>{const q=(S.cq||'').trim().toLowerCase(),has=m=>(m[1]||'').toLowerCase().includes(q),L=CH.map((c,i)=>[c,i]).filter(([c])=>!q||c.n.toLowerCase().includes(q)||c.m.some(has));
 return L.length?L.map(([c,i])=>{const hit=q&&c.m.slice().reverse().find(has),last=(c.m.filter(m=>m[1]).slice(-1)[0]||[0,''])[1];
  return Row({a:'thread:'+i,label:c.n+(c.u?`, ${c.u} unread`:''),lead:Cover(trip(c.tid),'m'),title:hl(c.n,q),sub:hit?`${hit[0]=='P'?'You':PE[hit[0]][2]}: ${hl(hit[1],q)}`:esc(last),trail:`<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="cap sm">${c.t}</span>${c.u?`<span class="bd2">${c.u}</span>`:''}</div>`})}).join(''):`<div style="padding-top:8px">${Empty('No chats found',`Nothing matches “${esc(S.cq)}”.`)}</div>`};
V.chat=()=>`<div class="hd"><h1>Chat</h1></div><div class="cs" style="margin-top:12px"><label class="fi sr">${ic('search',20)}<input id="cq" type="search" placeholder="Search chats and messages" aria-label="Search chats and messages" value="${esc(S.cq)}" oninput="A.cq(this.value)" autocomplete="off"><button class="x" data-a="cqclear" aria-label="Clear search" ${S.cq?'':'hidden'}>${ic('x',16)}</button></label></div><div id="clist" class="cl">${chatList()}</div>`;
const forkMsg=tid=>{const t=trip(tid),fk=t.fork,i=Object.keys(fk.ch)[0];return `<button class="fcm" data-a="fview:${tid}"><span class="xic">${ic('git-branch',22)}</span><span class="gr"><b>${esc(pn(fk.owner))}’s path</b><span class="cap sm" style="display:block">${i!=null?`Replaces ${esc(fk.stops[i].from)} with ${esc(fk.stops[i].n)}`:'An extra path'} · tap to view</span></span>${ic('chevron-right',18)}</button>`};
const msg=(m,i,a)=>{const me=m[0]=='P',f=!a[i-1]||a[i-1][0]!=m[0];return `<div class="m ${me?'me':''}">${f&&!me?`<span class="cap sm">${PE[m[0]][2]}</span>`:''}<div class="bub">${m[3]=='fork'?forkMsg(m[4]):esc(m[1])}</div></div>`};
V.thread=()=>{const c=CH[S.th];return `<div class="top"><button class="ib" data-a="back" aria-label="Back to chats">${ic('arrow-left')}</button><div class="tt"><b>${c.n}</b><span class="cap sm">${c.u2.length} members</span></div><span></span></div><div class="msgs" id="msgs" style="margin-top:8px">${c.m.map(msg).join('')}${S.typing?`<div class="m"><div class="bub"><span class="typ" aria-label="Typing"><i></i><i></i><i></i></span></div></div>`:''}</div><div class="comp"><input class="in" id="cin" placeholder="Message" aria-label="Message" onkeydown="if(event.key=='Enter')A.send()" style="border-radius:999px"><button class="play" style="width:48px;height:48px;background:var(--dusk);color:#fff;box-shadow:var(--gum)" data-a="send" aria-label="Send message">${ic('send',20)}</button></div>`};

/* ---------- profile ---------- */
V.profile=()=>{const p=S.p,pc=p.budget;return `<div class="pad" style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:12px"><div class="avwrap"><span class="av xl l-blue">${esc((p.name[0]||'P').toUpperCase())}</span><button class="avedit" data-a="toast:Photo picker would open here" aria-label="Change photo">${ic('camera',18)}</button></div><h1 style="margin-top:12px">${esc(p.name)||'You'}</h1><div class="cap">${esc(p.home)} · Joined 2025</div></div>
<div class="stat3"><div><b>${T.filter(t=>!t.left).length}</b><span>Trips</span></div><div><b>4</b><span>Friends</span></div><div><b>${SVL().length}</b><span>Saved</span></div></div>
${Sec('About you')}<div class="fl"><div><label class="lb" for="pn">Name</label><label class="fi">${ic('user',20)}<input id="pn" value="${esc(p.name)}" oninput="S.p.name=this.value;pd()" autocomplete="off"></label></div><div><label class="lb" for="pb">Bio</label><textarea class="in" id="pb" rows="3" oninput="S.p.bio=this.value;pd()">${esc(p.bio)}</textarea></div><div><label class="lb" for="ph">Home city</label><label class="fi sel"><select id="ph" onchange="S.p.home=this.value;pd()">${['Singapore','Johor Bahru','Kuala Lumpur'].map(c=>`<option${p.home==c?' selected':''}>${c}</option>`).join('')}</select><span class="chev">${ic('chevron-down',18)}</span></label></div></div>
${Sec('Travel style')}<div class="fl"><div><div class="lb">Pace</div>${Seg([['Chill','Chill'],['Balanced','Balanced'],['Packed','Packed']],p.pace,'ppace','Pace')}</div><div class="rowx"><div><b>Usual group size</b><div class="cap sm">We plan stops and tables around this</div></div><div class="qty" role="group" aria-label="Group size"><button data-a="pgroup:-1" aria-label="Fewer people" ${p.group<=1?'disabled':''}>${ic('minus',18)}</button><output aria-live="polite">${p.group}</output><button data-a="pgroup:1" aria-label="More people" ${p.group>=12?'disabled':''}>${ic('plus',18)}</button></div></div></div>
<div class="lb pad" style="margin:18px 0 0">Getting around</div><div role="radiogroup" aria-label="Getting around">${[['Walk','Walk','Short hops and scenic routes'],['MRT & bus','MRT & bus','Public transport first'],['Car','Car or taxi','Door to door']].map(([k,l,s])=>Radio(k,l,s,p.move,'pmove')).join('')}</div>
${Sec('Budget per trip',`<span class="tag" id="bv">SGD ${p.budget}</span>`)}<div class="pad"><input type="range" class="rg" min="50" max="2000" step="50" value="${p.budget}" style="--v:${(p.budget-50)/1950*100}%" aria-label="Budget per trip in SGD" oninput="S.p.budget=+this.value;this.style.setProperty('--v',((this.value-50)/1950*100)+'%');$('#bv').textContent='SGD '+this.value;pd()"><div class="rgl"><span>SGD 50</span><span>SGD 2,000</span></div></div>
${Sec('Dietary needs')}<div class="pad">${TagBox('diet',p.diet,'Add a dietary need…',['Halal','Vegetarian','Kosher','Vegan','Gluten-free'])}</div>${Sec('Accessibility needs')}<div class="pad">${TagBox('access',p.access,'Add an accessibility need…',['Step-free routes','Wheelchair access','Limited walking','Quiet spaces','Visual support','Hearing support'])}</div>
${Sec('Health & comfort',`<span class="cap sm">Used when plans change</span>`)}<div class="pad">${TagBox('health',p.health,'Add something we should know…',['Chronic eye stye','Asthma','Bad knees','Motion sickness','Heat sensitivity'])}</div>${Sec('Places you like')}<div class="pad">${TagBox('likes',p.likes,'Add a place type…',['Cafes','Museums','Hikes','Movies','Arts & crafts','Beaches','Night markets'])}</div>
${Sec('Notifications')}<div class="fl">${Switch('remind','Trip reminders','The day before, and on the morning',p.notif.remind)}${Switch('vote','Voting nudges','When your group is waiting on you',p.notif.vote)}${Switch('fork','Path activity','When someone forks a trip you’re on',p.notif.fork)}</div>
${Sec('Rate your last trip')}<div class="pad"><div class="r" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><b>Sunrise at East Coast</b><div class="cap sm">${p.rate?p.rate+' out of 5':'Tap a star'}</div></div><div class="rate" role="group" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button aria-pressed="${n<=p.rate}" aria-label="${n} star${n>1?'s':''}" data-a="prate:${n}">${ic('star',26,n<=p.rate?'currentColor':'none')}</button>`).join('')}</div></div></div>
${Sec('Saved places',`<span class="cap sm">${SVL().length}</span>`)}${SVL().slice(0,3).map(s=>Row({lead:StopIc(s),title:s.n,sub:byTxt(s.by)})).join('')}`};

/* =========================================================
   v3 ACTIONS
   ========================================================= */
const flagsFor=t=>{const ms=mstops(t),fr={};ms.forEach((s,i)=>{const r=S.fx.filter(id=>EXI.find(e=>e.id==id).f(s,i,t));if(r.length)fr[i]=r});return fr};
const altsFor=(t,i)=>{const ms=mstops(t),c=sll(t,ms[i]),pv=i?sll(t,ms[i-1]):oll(t),o=[[.0062,-.0085],[-.0048,.0098],[.0088,.0071],[-.0079,-.0052]];return ALTP.map((a,j)=>{const ll=[c[0]+o[j][0]*(1+.2*(i%2)),c[1]+o[j][1]];return Object.assign({},a,{ll,leg:legTxt(pv,ll)})})};
Object.assign(A,{
 open:id=>{S.cur=id;S.pv=null;S.step=fin(trip(id))?2:1;go('trip')},
 navigate:()=>{S.mapTrip=S.cur;S.nav=1;S.leg=0;S.mx=0;S.fk=null;tab('map')},
 mload:id=>{S.mapTrip=id;S.nav=1;S.leg=0;S.mx=0;S.fk=null;render('map');chrome()},
 endnav:()=>{S.nav=0;S.leg=0;S.fk=null;S.fl=[];render('map');chrome()},
 /* fork flow */
 forkopen:()=>{const onMap=S.nav&&S.tab=='map',t=onMap?trip(S.mapTrip):trip(S.cur);if(!forkWin(t))return toast('Alternatives open 24 hours before the trip starts');
  if(t.fork&&!t.fork.members.includes('P'))return lay('sheet',blockedHTML(t),'Paths');
  if(!(onMap&&S.mapTrip==t.id)){S.mapTrip=t.id;S.nav=1;S.leg=0;S.mx=0;S.fk=null;tab('map')}
  S.fx=[];lay('sheet',exiHTML(),'What’s changed')},
 fx:id=>{S.fx=S.fx.includes(id)?S.fx.filter(x=>x!=id):[...S.fx,id];setLy(exiHTML())},
 fapply:()=>{const t=trip(S.mapTrip),fr=flagsFor(t),fl=Object.keys(fr).map(Number);if(!fl.length)return setLy(clearHTML());
  S.fr=fr;S.fl=fl;S.fi=0;S.ap=null;S.fk='flag';A.closeLy();render('map');chrome();toast(`${ic('check',16)} ${fl.length==1?'One activity':fl.length+' activities'} affected`)},
 fagain:()=>setLy(exiHTML()),
 fsel:i=>{S.fi=Math.max(0,S.fl.indexOf(+i));render('map')},fnav:d=>{const n=S.fl.length;S.fi=(S.fi+(+d)+n)%n;render('map')},
 ffind:()=>{const t=trip(S.mapTrip);S.alts=altsFor(t,S.fl[S.fi]);S.ap=null;S.fk='alts';render('map')},
 fpick:j=>{S.ap=+j;render('map')},fback:()=>{S.fk='flag';S.ap=null;render('map')},
 fexit:()=>{S.fk=null;S.fl=[];S.ap=null;render('map')},
 finfo:()=>lay('sheet',altInfoHTML(),'Place info'),
 fconfirm:()=>{const t=trip(S.mapTrip),i=S.fl[S.fi],al=S.alts[S.ap];if(!al)return;if($('#ly').classList.contains('open'))A.closeLy();
  if(!t.fork)t.fork={owner:'P',members:['P'],stops:baseStops(t).map(s=>({...s})),ch:{}};
  const old=t.fork.stops[i];t.fork.stops[i]={n:al.n,t:old.t,i:al.i,s:al.s,k:al.k,ll:al.ll,x:old.x,y:old.y,tr:al.leg,u:0,d:0,m:0,alt:1,from:old.alt?old.from:old.n};t.fork.ch[i]=1;
  if(!t.fork.members.includes('P'))t.fork.members.push('P');
  S.fl.splice(S.fi,1);delete S.fr[i];S.ap=null;S.alts=[];
  if(S.fl.length){S.fi=Math.min(S.fi,S.fl.length-1);S.fk='flag';rr();render('map');toast(`${ic('check',16)} Swapped. ${S.fl.length} more to review`)}
  else{S.fk=null;rr();render('map');lay('sheet',doneHTML(t),'Your new path')}},
 finvite:()=>{const t=trip(S.mapTrip),c=CH.find(c=>c.tid==t.id);if(c){c.m.push(['P','',0,'fork',t.id]);c.t='now'}A.closeLy();rr();toast('Path shared in the '+t.n+' chat')},
 pathpick:(w,tid)=>{const t=trip(tid||(S.nav?S.mapTrip:S.cur));if(!t||!t.fork)return;if(myPath(t)==w)return toast(`You’re already on ${w=='fork'?pn(t.fork.owner)+'’s':'the main'} path`);if($('#ly').classList.contains('open'))A.closeLy();lay('sheet',joinHTML(t,w),'Join a path')},
 pathjoin:(w,tid)=>{const t=trip(tid),fk=t.fork;if(w=='fork'){if(!fk.members.includes('P'))fk.members.push('P')}else fk.members=fk.members.filter(k=>k!='P');S.leg=0;S.pv=null;A.closeLy();rr();render('map');chrome();toast(w=='fork'?`You joined ${pn(fk.owner)}’s path`:'You’re back on the main path')},
 pview:k=>{S.pv=k;render('trip')},
 fview:tid=>{S.mapTrip=tid;S.nav=1;S.leg=0;S.mx=0;S.fk=null;tab('map')},
 /* chat */
 cq:v=>{S.cq=v;$('#clist').innerHTML=chatList();const x=$('#s-chat .x');if(x)x.hidden=!v},cqclear:()=>{S.cq='';render('chat');const i=$('#cq');i&&i.focus()},
 /* profile */
 ppace:k=>{S.p.pace=k;pd();render('profile')},pmove:k=>{S.p.move=decodeURIComponent(k);pd();render('profile')},pgroup:d=>{S.p.group=Math.max(1,Math.min(12,S.p.group+ +d));pd();render('profile')},
 pnotif:k=>{S.p.notif[k]=S.p.notif[k]?0:1;pd();render('profile')},prate:n=>{S.p.rate=+n;pd();render('profile')}});
/* send keeps working with the new message shape */
A.send=()=>{const el=$('#cin'),v=el.value.trim();if(!v)return;const c=CH[S.th];c.m.push(['P',v]);S.typing=1;render('thread');$('#cin').focus();bottom();const th=S.th;setTimeout(()=>{const k=c.m.find(x=>x[0]!='P')[0];c.m.push([k,c.r[c.m.length%c.r.length]]);if(S.th==th)S.typing=0;render('thread');bottom();tabbar()},1500)};
/* swipe in from the left edge = back (pushed screens only) */
let SW=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType=='mouse'&&e.button)return;const d=$('#dev').getBoundingClientRect();if(e.clientX-d.left<24&&cur().length>1&&!$('#ly').classList.contains('open'))SW={x:e.clientX,y:e.clientY}});
document.addEventListener('pointerup',e=>{if(SW&&e.clientX-SW.x>70&&Math.abs(e.clientY-SW.y)<60)A.back();SW=null});
document.addEventListener('pointercancel',()=>SW=null);

rr();
</script></body></html>
